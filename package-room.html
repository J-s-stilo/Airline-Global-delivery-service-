*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f9;color:#18202a}.container{width:min(1100px,92%);margin:auto}header{background:#10233f;color:#fff;padding:18px 0;position:sticky;top:0;z-index:20}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.logo span{color:#d5aa43}.back{color:#fff;text-decoration:none;font-size:13px;background:#c99a2e;padding:10px 15px;border-radius:6px}.hero{background:linear-gradient(120deg,#10233f,#123944);color:#fff;padding:45px 0}.eyebrow{color:#e4c36a;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}.hero h1{margin:10px 0;font-size:clamp(32px,6vw,54px)}.hero p{color:#d7e1e6;line-height:1.6}.code{font-weight:bold;color:#e4c36a}.wrap{padding:35px 0}.card{background:#fff;border:1px solid #e1e6e9;border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.info{background:#f7f8f9;border-radius:8px;padding:16px}.info small{display:block;color:#77818a;margin-bottom:5px}.status{display:inline-block;background:#e9f8ef;color:#18733d;border-radius:20px;padding:8px 13px;font-weight:bold;font-size:13px}.package-img{width:100%;max-height:430px;object-fit:cover;border-radius:10px;margin-top:15px;display:block}.update{background:#fbf5e5;border:1px solid #cce8e8;border-radius:9px;padding:18px}.update p{margin:7px 0 0;line-height:1.6}.timeline-item{display:flex;gap:14px;margin:17px 0}.dot{width:15px;height:15px;border-radius:50%;background:#d1d6da;flex:none;margin-top:2px}.dot.active{background:#c99a2e;box-shadow:0 0 0 5px #e5f7f7}.tltext strong{display:block}.tltext span{color:#77818a;font-size:13px}.mapbox{display:none}.map-summary{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f7f8f9;padding:14px;border-radius:8px;flex-wrap:wrap;margin-bottom:14px}.point{flex:1;min-width:150px}.point small{display:block;color:#77818a;font-size:12px;margin-bottom:4px}.point strong{font-size:14px}.arrow{color:#c99a2e;font-size:22px}#shipmentMap{height:420px;border-radius:10px;overflow:hidden}.map-status{color:#6d7780;font-size:13px;margin-top:10px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.item{border:1px solid #e1e5ea;border-radius:14px;padding:20px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.06);min-width:0}.item img{width:100%;height:250px;object-fit:cover;border-radius:10px;background:#eef1f3;display:block;cursor:zoom-in}.item h3{margin:14px 0 9px;font-size:18px;line-height:1.35}.item p{margin:8px 0;color:#69747c;font-size:14px;line-height:1.55}.price{font-size:18px;font-weight:bold;color:#18202a} .support{position:relative;overflow:hidden;background:#ffffff;color:#18202a;border:1px solid #dfe5ea;box-shadow:0 10px 28px rgba(24,32,42,.07)}.support h2{color:#18202a}.support-ticker{display:flex;gap:26px;white-space:nowrap;overflow:hidden;background:#f3f6f8;color:#168f9b;border:1px solid #dce5e9;border-radius:9px;padding:10px 13px;margin:0 0 15px;font-size:12px;font-weight:700}.support-ticker span{display:inline-block;animation:supportMove 16s linear infinite}@keyframes supportMove{from{transform:translateX(20%)}to{transform:translateX(-110%)}}.support .small{color:#69747c}.support a,.support button{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;padding:11px 16px;border-radius:7px;margin:5px 8px 0 0;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease}.support a:hover,.support button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.12);opacity:.94}.tawk-support-button{background:#168f9b}.mail{background:#18202a}.support-note{display:block;margin-top:12px;color:#77818a;font-size:12px}.empty{color:#77818a;padding:10px 0}.loading{text-align:center;padding:60px 0}.error{background:#fff1f0;color:#b42318;border:1px solid #f0c9c5;border-radius:9px;padding:18px}.small{color:#77818a;font-size:13px}footer{background:#081525;color:#9ba5ad;padding:30px 0;text-align:center;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hero{padding:35px 0}.card{padding:18px}#shipmentMap{height:330px}.head{gap:12px}.back{white-space:nowrap}}
</style>

<style>
:root{
  --navy:#071b35;
  --navy2:#0d2b4f;
  --gold:#caa24d;
  --gold2:#ead18d;
  --ink:#152235;
  --muted:#718096;
  --bg:#f4f7fb;
  --line:#dfe6ee;
  --white:#fff;
}
body{
  background:
    radial-gradient(circle at 90% 0%,rgba(202,162,77,.10),transparent 25%),
    linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);
  color:var(--ink);
}
header{
  background:linear-gradient(105deg,var(--navy),var(--navy2));
  border-bottom:1px solid rgba(234,209,141,.55);
  box-shadow:0 8px 24px rgba(7,27,53,.16);
}
.logo{letter-spacing:.8px;text-transform:uppercase}
.logo span{color:var(--gold2)}
.back{
  color:#fff!important;
  border:1px solid rgba(234,209,141,.65);
  background:rgba(255,255,255,.07);
  border-radius:7px;
  padding:10px 15px;
  font-weight:700;
}
.hero{
  min-height:310px;
  display:flex;
  align-items:center;
  background-image:
    linear-gradient(110deg,rgba(4,19,38,.96),rgba(10,43,79,.78)),
    url('https://images.unsplash.com/photo-1494412574643-ff11b0a0f676?auto=format&fit=crop&w=1800&q=85') !important;
  background-size:cover!important;
  background-position:center!important;
  border-bottom:1px solid rgba(202,162,77,.35);
  position:relative;
  overflow:hidden;
}
.hero:before{
  content:"";
  position:absolute;
  width:360px;height:360px;
  right:-120px;top:-170px;
  border:1px solid rgba(234,209,141,.25);
  border-radius:50%;
  box-shadow:0 0 0 45px rgba(234,209,141,.025),0 0 0 90px rgba(234,209,141,.02);
}
.hero .container{position:relative;z-index:2}
.eyebrow{
  color:var(--gold2)!important;
  letter-spacing:1.7px;
  font-weight:800;
}
.hero h1{
  font-size:clamp(38px,6vw,62px);
  letter-spacing:-1.2px;
}
.hero p{color:rgba(255,255,255,.82)}
.code{
  color:var(--gold2)!important;
  font-weight:800;
}
.status{
  display:inline-flex!important;
  align-items:center;
  gap:7px;
  background:rgba(202,162,77,.14)!important;
  color:#f6df9a!important;
  border:1px solid rgba(234,209,141,.45);
  border-radius:999px!important;
  padding:8px 13px!important;
  font-weight:800;
  letter-spacing:.5px;
}
.status:before{
  content:"";
  width:7px;height:7px;
  border-radius:50%;
  background:#e2bd63;
  box-shadow:0 0 0 4px rgba(226,189,99,.13);
}
.wrap{padding:44px 0 70px}
.card{
  background:rgba(255,255,255,.98)!important;
  border:1px solid var(--line)!important;
  border-radius:16px!important;
  box-shadow:0 12px 32px rgba(20,34,53,.07)!important;
  padding:26px!important;
  margin-bottom:22px;
}
.card h2{
  color:var(--navy)!important;
  font-size:21px;
  letter-spacing:-.2px;
}
.grid{gap:12px!important}
.info{
  background:#f8fafc!important;
  border:1px solid #e5ebf2!important;
  border-radius:11px!important;
  padding:16px!important;
}
.info small,.point small{color:#7a8797!important;text-transform:uppercase;letter-spacing:.7px;font-size:10px;font-weight:800}
.info strong{color:#1b2a3d!important;font-size:15px}
.update{
  background:linear-gradient(90deg,#f8fafc,#fffdf7)!important;
  border-left:4px solid var(--gold)!important;
  border-radius:10px!important;
  padding:17px!important;
}
.timeline-item{position:relative;padding:0 0 22px 35px!important}
.timeline-item:before{
  content:"";
  position:absolute;left:7px;top:18px;bottom:0;
  width:2px;background:#dce4ed;
}
.timeline-item:last-child:before{display:none}
.dot{
  position:absolute!important;
  left:0!important;top:2px!important;
  width:16px!important;height:16px!important;
  border-radius:50%!important;
  background:#d7dee7!important;
  border:3px solid #fff!important;
  box-shadow:0 0 0 1px #cdd6e0!important;
}
.dot.active{
  background:var(--gold)!important;
  box-shadow:0 0 0 1px var(--gold),0 0 0 6px rgba(202,162,77,.12)!important;
}
.tltext strong{color:var(--navy)!important}
.tltext span{color:var(--muted)!important}
.mapbox{overflow:hidden}
.map-summary{
  background:#f7f9fc!important;
  border:1px solid var(--line)!important;
  border-radius:11px!important;
  padding:15px!important;
  margin-bottom:16px!important;
}
.arrow{color:var(--gold)!important;font-weight:900}
#shipmentMap{
  height:430px!important;
  border-radius:13px!important;
  border:1px solid #dbe3ec;
}
.map-status{color:#7a8797!important}
.items{gap:18px!important}
.item{
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  background:#fff!important;
  box-shadow:0 8px 24px rgba(20,34,53,.055)!important;
  padding:18px!important;
}
.item img{border-radius:10px!important}
.price{color:var(--navy)!important}
.support{
  background:
    linear-gradient(135deg,#071b35 0%,#0d2b4f 72%,#102f53 100%)!important;
  border:1px solid rgba(202,162,77,.55)!important;
  color:#fff!important;
  box-shadow:0 16px 36px rgba(7,27,53,.18)!important;
  position:relative;
  overflow:hidden;
}
.support:after{
  content:"";
  position:absolute;
  width:220px;height:220px;
  right:-100px;bottom:-120px;
  border:1px solid rgba(234,209,141,.18);
  border-radius:50%;
}
.support h2{color:#fff!important}
.support .small{color:rgba(255,255,255,.76)!important}
.support-ticker{
  background:rgba(255,255,255,.075)!important;
  color:#f1d78f!important;
  border:1px solid rgba(234,209,141,.25)!important;
  border-radius:9px!important;
}
.support a,.support button{
  border-radius:8px!important;
  padding:12px 17px!important;
}
.tawk-support-button{
  background:linear-gradient(135deg,#d6ae56,#b9872c)!important;
  color:#0b1b30!important;
  box-shadow:0 7px 18px rgba(0,0,0,.18)!important;
}
.mail{
  background:rgba(255,255,255,.10)!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.25)!important;
}
.support-note{color:rgba(255,255,255,.58)!important}
.empty{color:#7b8795!important}
footer{
  background:#06162b!important;
  border-top:1px solid rgba(234,209,141,.35);
  color:#9eabba!important;
}
@media(max-width:700px){
  .hero{min-height:270px}
  .card{padding:20px!important;border-radius:14px!important}
  #shipmentMap{height:330px!important}
  .map-summary{display:flex;flex-direction:column;gap:10px}
  .arrow{transform:rotate(90deg);text-align:center}
}
</style>

</head>
<body>
<header><div class="container head"><div class="logo">AIRLINE GLOBAL DELIVERY SERVICE <span>Worldwide Delivery</span></div><a class="back" href="/">Main Website</a></div></header>
<section class="hero" style="background-image:linear-gradient(120deg,rgba(16,35,63,.94),rgba(16,35,63,.78)),url('https://images.unsplash.com/photo-1494412574643-ff11b0a0f676?auto=format&fit=crop&w=1800&q=85');background-size:cover;background-position:center;"><div class="container"><div class="eyebrow">Private Customer Shipment Room</div><h1>Your Shipment</h1><p>Secure shipment information for tracking number <span class="code" id="heroCode">Loading...</span></p><span class="status" id="heroStatus">Loading</span></div></section>
<main class="wrap"><div class="container" id="app"><div class="loading">Loading shipment information...</div></div></main>
<footer>© Airline Global Delivery Service</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const code=new URLSearchParams(location.search).get('code');let shipmentMap=null;let layers=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=v=>{if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
function active(status,stage){const s=String(status||'').toLowerCase();if(stage===0)return true;if(stage===1)return /processing|transit|arrived|destination|out for delivery|delivered/.test(s);if(stage===2)return /transit|arrived|destination|out for delivery|delivered/.test(s);if(stage===3)return /arrived|destination|out for delivery|delivered/.test(s);if(stage===4)return /out for delivery|delivered/.test(s);return false}
function timeline(status){const a=['Shipment received','Processing','In transit','Destination','Delivered'];return '<div>'+a.map((x,i)=>'<div class="timeline-item"><div class="dot '+(active(status,i)?'active':'')+'"></div><div class="tltext"><strong>'+x+'</strong><span>'+((active(status,i))?'Completed/current stage':'Pending')+'</span></div></div>').join('')+'</div>'}
async function geocode(q){if(!q)return null;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j[0])return null;return[Number(j[0].lat),Number(j[0].lon),j[0].display_name||q]}catch(e){return null}}
async function drawMap(s){const box=document.getElementById('mapBox');const st=document.getElementById('mapStatus');if(s.latitude==null||s.longitude==null||!Number.isFinite(Number(s.latitude))||!Number.isFinite(Number(s.longitude))){st.textContent='Shipment location is not currently available.';return}box.style.display='block';document.getElementById('mapOrigin').textContent=s.origin||'Origin not specified';document.getElementById('mapCurrent').textContent=s.location||'Current location';document.getElementById('mapDestination').textContent=s.destination||'Destination not specified';if(typeof L==='undefined'){st.textContent='Map could not load. Please refresh the page.';return}shipmentMap=L.map('shipmentMap',{zoomControl:true}).setView([Number(s.latitude),Number(s.longitude)],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(shipmentMap);const pts=[];const o=await geocode(s.origin),d=await geocode(s.destination);if(o){L.marker([o[0],o[1]]).addTo(shipmentMap).bindPopup('<strong>Shipment Origin</strong><br>'+esc(s.origin));pts.push([o[0],o[1]])}L.marker([Number(s.latitude),Number(s.longitude)]).addTo(shipmentMap).bindPopup('<strong>Airline Global Delivery Service Shipment</strong><br>'+esc(s.location||'Current shipment position'));pts.push([Number(s.latitude),Number(s.longitude)]);if(d){L.marker([d[0],d[1]]).addTo(shipmentMap).bindPopup('<strong>Shipment Destination</strong><br>'+esc(s.destination));pts.push([d[0],d[1]])}if(pts.length>1)L.polyline(pts,{weight:4,opacity:.85,dashArray:'10 8'}).addTo(shipmentMap);shipmentMap.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:12,animate:false});setTimeout(()=>shipmentMap.invalidateSize(true),300);st.textContent='Current shipment coordinates: '+Number(s.latitude).toFixed(5)+', '+Number(s.longitude).toFixed(5)+(o&&d?' • Origin and destination displayed.':'');}
function openImage(src){const v=document.createElement("div");v.style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out";v.innerHTML=`<button style="position:absolute;top:16px;right:16px;width:42px;height:42px;border:0;border-radius:50%;font-size:25px;cursor:pointer">×</button><img src="${src}" style="max-width:96%;max-height:92%;object-fit:contain;border-radius:10px">`;v.onclick=e=>{if(e.target===v||e.target.tagName==="BUTTON")v.remove()};document.body.appendChild(v)}
function openCustomerSupport(){if(window.Tawk_API&&typeof window.Tawk_API.maximize==="function"){window.Tawk_API.maximize()}else{setTimeout(openCustomerSupport,300)}}
async function load(){if(!code){document.getElementById('app').innerHTML='<div class="error">No tracking number was provided.</div>';return}try{const r=await fetch('/api/shipments/'+encodeURIComponent(code));if(!r.ok)throw new Error('Shipment not found');const s=await r.json();document.getElementById('heroCode').textContent=s.code||code;document.getElementById('heroStatus').textContent=s.status||'Shipment update';let mall=[];try{const mr=await fetch('/api/shipments/'+encodeURIComponent(code)+'/mall');if(mr.ok)mall=await mr.json()}catch(e){}const items=Array.isArray(mall)?mall:[];document.getElementById('app').innerHTML=`<div class="card"><h2>Shipment Overview</h2><div class="grid"><div class="info"><small>Tracking Number</small><strong>${esc(s.code)}</strong></div><div class="info"><small>Current Status</small><strong>${esc(s.status||'-')}</strong></div><div class="info"><small>Customer</small><strong>${esc(s.customer||'-')}</strong></div><div class="info"><small>Updated</small><strong>${esc(fmt(s.updated))}</strong></div><div class="info"><small>Origin</small><strong>${esc(s.origin||'-')}</strong></div><div class="info"><small>Destination</small><strong>${esc(s.destination||'-')}</strong></div><div class="info"><small>Current Location</small><strong>${esc(s.location||'-')}</strong></div><div class="info"><small>Estimated Delivery</small><strong>${esc(fmt(s.estimated_delivery))}</strong></div></div></div>${s.image_url?`<div class="card"><h2>Package</h2><p><strong>${esc(s.item_name||'Shipment')}</strong></p><p class="small">${esc(s.item_description||'')}</p><img class="package-img" src="${esc(s.image_url)}" alt="Package image" onclick="window.open(this.src,'_blank')"></div>`:''}${s.note?`<div class="card"><h2>Latest Shipment Update</h2><div class="update"><strong>${esc(fmt(s.updated))}</strong><p>${esc(s.note)}</p></div></div>`:''}<div class="card"><h2>Shipment Journey</h2>${timeline(s.status)}</div><div class="card mapbox" id="mapBox"><h2>Live Shipment Map</h2><div class="map-summary"><div class="point"><small>Origin</small><strong id="mapOrigin">-</strong></div><div class="arrow">→</div><div class="point"><small>Current</small><strong id="mapCurrent">-</strong></div><div class="arrow">→</div><div class="point"><small>Destination</small><strong id="mapDestination">-</strong></div></div><div id="shipmentMap"></div><div class="map-status" id="mapStatus">Loading shipment route...</div></div><div class="card"><h2>Purchased Items</h2><div id="items">${items.length?'<div class="items">'+items.map(i=>`<div class="item">${i.image_url?`<img src="${esc(i.image_url)}" alt="${esc(i.product_name||'Product')}" onclick="openImage(this.src)">`:''}<h3>${esc(i.product_name||'Purchased Item')}</h3><div class="price">${esc(i.currency||'USD')} ${esc(i.price||'0')}</div><p>Quantity: ${esc(i.quantity||1)}</p><p>Seller/Store: ${esc(i.seller||'-')}</p><p>Purchase date: ${esc(fmt(i.purchase_date))}</p><p>Status: <strong>${esc(i.purchase_status||'-')}</strong></p></div>`).join('')+'</div>':'<div class="empty">No purchased items have been added to this shipment.</div>'}</div></div><div class="card support"><h2 style="margin-bottom:8px">Customer Support</h2><div class="support-ticker"><span>✈️ Airline Global Delivery Service&nbsp;&nbsp; • &nbsp;&nbsp;💬 Customer support is ready to assist&nbsp;&nbsp; • &nbsp;&nbsp;📦 Worldwide delivery updates</span></div><p class="small">Need help with this shipment? Our customer support team is available to assist with tracking, delivery updates and shipment questions.</p><button type="button" class="tawk-support-button" onclick="openCustomerSupport()" aria-label="Open Airline Global Delivery Service customer support">💬 Live Customer Support</button><a class="mail" href="mailto:delightedinternationaldelivery@gmail.com">✉ Email Support</a><span class="support-note">For the fastest assistance, use Live Customer Support.</span></div>`;await drawMap(s)}catch(e){document.getElementById('app').innerHTML='<div class="error">Unable to load this shipment. Please check the tracking number and try again.</div>';}}
load();window.addEventListener('resize',()=>shipmentMap&&shipmentMap.invalidateSize(true));
</script>
